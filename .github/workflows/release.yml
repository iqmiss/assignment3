# Continuous delivery: pushing a version tag (v0.1.0, v0.2.0, ...) re-runs the
# tests, builds the wheel and sdist, runs the reproducibility check, and
# publishes a GitHub Release with the packages and the run manifest attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests must pass before anything is published
        run: pytest --cov
      - name: Tag must match the package version
        run: |
          version=$(python -c "import hode; print(hode.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - name: Reproducibility record for this release
        run: |
          hode run configs/synthetic.toml
          hode verify results/manifest.json
          cp results/manifest.json dist/manifest-${GITHUB_REF_NAME}.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
