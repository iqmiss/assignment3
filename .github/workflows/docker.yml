# Container CI (GitHub Actions mirror of the Jenkinsfile, for reviewers without Jenkins).
# Every push: test stage inside Docker, runtime image build, in-container run + hode verify
# + hode plot; the results and heatmaps are kept as the "container-run" artifact.
# Pushes to main also publish the image to GitHub Container Registry (ghcr.io).
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, test and verify the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Tests inside the container (test stage)
        run: docker build --target test -t hode:test .

      - name: Build the runtime image
        run: docker build --target runtime -t hode:${{ github.sha }} .

      - name: Smoke test - synthetic sweep, hash verification and heatmaps in the container
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/app/results" hode:${{ github.sha }}
          ls out out/plots

      - name: Publish the container's results and heatmaps
        uses: actions/upload-artifact@v4
        with:
          name: container-run
          path: out/

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hode
          docker tag hode:${{ github.sha }} $IMAGE:${GITHUB_SHA::7}
          docker tag hode:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
