name: Bug report
description: Something produced a wrong result, crashed, or failed to reproduce
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please never paste record-level data. Reproduce the problem on synthetic
        data (`hode synth`) or describe the count table instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration (TOML) and command
      render: toml
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: manifest.json of the run (hashes and versions)
      render: json
  - type: input
    id: version
    attributes:
      label: hode version (`hode --version`)
    validations:
      required: true
